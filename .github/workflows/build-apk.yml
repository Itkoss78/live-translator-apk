# Compile l'APK sur GitHub et le publie dans « Releases » :
# un lien direct LiveTranslator.apk à ouvrir depuis le téléphone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk LiveTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranslator-apk
          path: LiveTranslator.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Live Translator build ${{ github.run_number }}
          files: LiveTranslator.apk
          make_latest: true
