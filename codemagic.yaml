# Compilation de l'APK sur Codemagic (alternative à GitHub Actions).
# codemagic.io → connexion avec GitHub → ajouter le dépôt → Start new build.
workflows:
  android-apk:
    name: Live Translator APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: SDK Android
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Gradle 8.10.2
        script: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
      - name: Compiler l'APK
        script: |
          ./gradle-8.10.2/bin/gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk LiveTranslator.apk
    artifacts:
      - LiveTranslator.apk
